name: Full publication-grid parity (manual)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/full-publication-parity.yml'

jobs:
  full-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Compare full 1000-coefficient original and standalone grids and fits
        env:
          MPLBACKEND: Agg
          NUMBA_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m Tests.compare_full_publication_grid
